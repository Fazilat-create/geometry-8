<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные учебники · 8 класс</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }
        .portal-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .portal-card--geo { background: linear-gradient(135deg, #2563eb, #1e40af); }
        .portal-card--alg { background: linear-gradient(135deg, #ea580c, #c2410c); }
        .portal-card__title { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; }
        .portal-card__desc { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-header__title">Интерактивные учебники</h1>
            <p class="site-header__subtitle">8 класс · II четверть</p>
        </div>
    </header>

    <main class="container">
        <div class="portal-grid">
            <a href="geometry/index.html" class="portal-card portal-card--geo">
                <h2 class="portal-card__title">Геометрия</h2>
                <p class="portal-card__desc">Площади. Теорема Пифагора</p>
            </a>
            <a href="algebra/index.html" class="portal-card portal-card--alg">
                <h2 class="portal-card__title">Алгебра</h2>
                <p class="portal-card__desc">Квадратные корни и уравнения</p>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© Интерактивные учебники · 8 класс</p>
        </div>
    </footer>
</body>
</html>
